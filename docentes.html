<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="JS/docentes.js" defer></script>
    <title>SGA - Docentes</title>
</head>
<body>
      <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html">Docentes</a>
        </nav>
    </header>
 <main>
    <section class="formulario">
     <h2>Alta de Docentes</h2>
     <form id="formDocentes">

     <label for="nombre">Nombre</label>
     <input type="text" id="nombre"><br><br>

     <label for="especialidad">Especialidad</label>
     <input type="text" id="especialidad"><br><br>

     <label for="correo">Correo electrónico</label>
     <input type="text" id="correo"><br><br>

     <button type="submit">Registrar Docente</button>
     </form>
      <p id="mensaje" class="oculto"></p>
    </section>

    <section class="docentes">
     <h2>Docentes registrados</h2>
     <p id="cantidadDocentes"></p>
     <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Correo Electónico</th>
                <th>Acciónes</th>
            </tr>
        </thead>
        <tbody id="listaDocentes"></tbody>
     </table>
    </section>
     </main>
</body>
</html>
